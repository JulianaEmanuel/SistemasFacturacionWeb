spring.application.name=sistemaweb
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.default=postgres
spring.profiles.group.pruebas=postgres
app.ambiente.url-pruebas=${APP_URL_PRUEBAS:http://127.0.0.1:8081/login}

# Configuracion de correo local (simulado/pruebas)
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.correo.bandeja-local=${CORREO_BANDEJA_LOCAL:${app.correo.local-predeterminada:false}}
app.recovery.mail-from=${SMTP_FROM:${SMTP_USERNAME:}}
app.recovery.hmac-key=${RECOVERY_HMAC_KEY:}
app.recovery.public-base-url=${RECOVERY_PUBLIC_BASE_URL:http://127.0.0.1:${server.port}}
app.sqlserver.trust-server-certificate=false
app.security.admin-type=${ADMIN_TYPE:ADMINISTRADOR}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
# Evitar que el diagnóstico de SQL o parámetros exponga credenciales.
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.security=INFO
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
# Fotografias locales, fuera de recursos publicos y de Git. No requiere cambios SQL.
app.perfil.fotos-dir=${PROFILE_PHOTO_DIR:data/perfiles}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
