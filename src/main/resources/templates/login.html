<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión | Sistema de Facturación Web')}"></head>
<body class="login-page">
<button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle hidden aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i></button>
<main class="login-stage login-split">
    <div class="login-photo">
        <img th:src="@{/images/login-papeleria.png}" alt="" fetchpriority="high">
        <a class="login-brand" th:href="@{/login}" aria-label="Sistema de Facturación Web">
            <span class="portal-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 5h14v23l-3-2-4 2-4-2-3 2V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 11h6m-6 5h6m-6 5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
            <span>Sistema de Facturación <strong>Web</strong></span>
        </a>
    </div>
    <div class="login-panel">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Iniciar sesión</h1>
            <p th:if="${ambientePruebas}" class="portal-message" role="status">Ambiente de pruebas</p>
            <div th:if="${param.error}" class="portal-message message-error" role="alert"><i class="bi bi-exclamation-circle" aria-hidden="true"></i><span>No se pudo iniciar sesión. Comprueba tus credenciales y el estado de tu cuenta.</span></div>
            <div th:if="${param.logout}" class="portal-message message-success" role="status">Sesión cerrada correctamente.</div>
            <div th:if="${param.expired}" class="portal-message message-warning" role="status">Tu sesión ya no está disponible. Inicia sesión nuevamente.</div>
            <form method="post" th:action="@{/login}" class="login-form">
                <label for="username">Usuario</label><div class="login-input"><i class="bi bi-person" aria-hidden="true"></i><input id="username" name="username" maxlength="100" autocomplete="username" placeholder="Tu nombre de usuario" required autofocus></div>
                <label for="password">Contraseña</label><div class="login-input"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
                    <button id="password-toggle" class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-controls="password" aria-pressed="false" title="Mostrar contraseña">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 3 18 18M10 5.2c.6-.1 1.3-.2 2-.2 6.5 0 10 7 10 7a18 18 0 0 1-3 3.8M6.2 6.2A23 23 0 0 0 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.2M10 10a3 3 0 0 0 4 4"/></svg>
                    </button>
                </div>
                <p class="login-recovery-link"><a th:href="@{/recuperar-contrasenia}">¿Olvidaste tu contraseña?</a></p>
                <button class="portal-primary login-submit" type="submit">Iniciar sesión <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
            </form>
        </section>
    </div>
</main>
<script th:src="@{/js/login.js}"></script>
</body></html>
