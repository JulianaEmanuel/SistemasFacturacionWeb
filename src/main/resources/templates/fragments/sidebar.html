<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
	<aside th:fragment="sidebar(activePage)" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar" aria-label="Navegación principal">
		<div class="sidebar-brand offcanvas-header">
			<a class="brand-lockup" th:href="@{/}" title="Ir al inicio">
				<span class="brand-mark"><i class="bi bi-receipt-cutoff" aria-hidden="true"></i></span>
				<span class="brand-name">Sistema<span>Facturación</span></span>
			</a>
			<button class="sidebar-collapse-btn d-none d-lg-inline-grid" type="button" id="sidebarCollapseBtn" aria-expanded="true" aria-label="Contraer menú lateral" title="Contraer menú lateral">
				<i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
			</button>
			<button class="btn-close btn-close-white d-lg-none" type="button" data-bs-dismiss="offcanvas" data-bs-target="#appSidebar" aria-label="Cerrar menú"></button>
		</div>
		<div class="offcanvas-body p-0 d-flex flex-column">
			<div class="sidebar-cta-wrap">
				<a class="sidebar-cta" th:href="@{/modulos/facturas/nuevo}" title="Emitir nueva factura" data-nav-item data-nav-label="Emitir factura" data-nav-group="ACCESO DIRECTO">
					<i class="bi bi-plus-circle-fill" aria-hidden="true"></i><span>Emitir factura</span>
				</a>
			</div>
			<nav class="sidebar-nav">
				<p class="nav-caption">GENERAL</p>
				<a class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? ' is-active' : ''" th:href="@{/}" title="Inicio" data-nav-item data-nav-label="Inicio" data-nav-group="GENERAL">
					<i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Inicio</span>
				</a>
				<a class="sidebar-link" th:classappend="${activePage == 'reportes'} ? ' is-active' : ''" th:href="@{/modulos/reportes}" title="Reportes" data-nav-item data-nav-label="Reportes" data-nav-group="GENERAL">
					<i class="bi bi-bar-chart-line" aria-hidden="true"></i><span>Reportes</span>
				</a>

				<p class="nav-caption nav-caption-spaced">FACTURACIÓN Y SRI</p>
				<a class="sidebar-link" th:classappend="${activePage == 'facturas'} ? ' is-active' : ''" th:href="@{/modulos/facturas}" title="Facturas" data-nav-item data-nav-label="Facturas" data-nav-group="FACTURACIÓN Y SRI">
					<i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Facturas</span>
				</a>
				<a class="sidebar-link" th:classappend="${activePage == 'mis-facturas'} ? ' is-active' : ''" th:href="@{/modulos/mis-facturas}" title="Mis comprobantes" data-nav-item data-nav-label="Mis comprobantes" data-nav-group="FACTURACIÓN Y SRI">
					<i class="bi bi-receipt" aria-hidden="true"></i><span>Mis comprobantes</span>
				</a>
				<a th:if="${administracionDisponible}" class="sidebar-link" th:classappend="${activePage == 'sri-config'} ? ' is-active' : ''" th:href="@{/modulos/sri/configuracion}" title="Configuración SRI" data-nav-item data-nav-label="Configuración SRI" data-nav-group="FACTURACIÓN Y SRI">
					<i class="bi bi-patch-check" aria-hidden="true"></i><span>Configuración SRI</span>
					<em class="sidebar-pill" th:classappend="${ambientePruebas} ? ' is-test' : ''" th:text="${ambientePruebas} ? 'Pruebas' : 'Prod'">Prod</em>
				</a>

				<p class="nav-caption nav-caption-spaced">CATÁLOGOS</p>
				<a class="sidebar-link" th:classappend="${activePage == 'clientes'} ? ' is-active' : ''" th:href="@{/modulos/clientes}" title="Clientes" data-nav-item data-nav-label="Clientes" data-nav-group="CATÁLOGOS">
					<i class="bi bi-people" aria-hidden="true"></i><span>Clientes</span>
				</a>
				<a class="sidebar-link" th:classappend="${activePage == 'productos'} ? ' is-active' : ''" th:href="@{/modulos/productos}" title="Productos" data-nav-item data-nav-label="Productos" data-nav-group="CATÁLOGOS">
					<i class="bi bi-box-seam" aria-hidden="true"></i><span>Productos</span>
				</a>
				<a th:if="${administracionDisponible}" class="sidebar-link" th:classappend="${activePage == 'proveedores'} ? ' is-active' : ''" th:href="@{/modulos/proveedores}" title="Proveedores" data-nav-item data-nav-label="Proveedores" data-nav-group="CATÁLOGOS">
					<i class="bi bi-truck" aria-hidden="true"></i><span>Proveedores</span>
				</a>

				<th:block th:if="${administracionDisponible}">
					<p class="nav-caption nav-caption-spaced">EQUIPO Y SEGURIDAD</p>
					<a class="sidebar-link" th:classappend="${activePage == 'empleados'} ? ' is-active' : ''" th:href="@{/modulos/empleados}" title="Empleados" data-nav-item data-nav-label="Empleados" data-nav-group="EQUIPO Y SEGURIDAD">
						<i class="bi bi-person-workspace" aria-hidden="true"></i><span>Empleados</span>
					</a>
					<div class="sidebar-group" data-sidebar-group th:classappend="${activePage == 'usuarios' or activePage == 'tipos-usuario'} ? ' is-open' : ''">
						<button type="button" class="sidebar-link sidebar-group-toggle" th:attr="aria-expanded=${activePage == 'usuarios' or activePage == 'tipos-usuario'}" aria-controls="sidebarSecurityMenu" title="Accesos y roles">
							<i class="bi bi-shield-lock" aria-hidden="true"></i>
							<span>Accesos y roles</span>
							<i class="bi bi-chevron-down sidebar-chevron" aria-hidden="true"></i>
						</button>
						<div class="sidebar-submenu" id="sidebarSecurityMenu">
							<a class="sidebar-link sidebar-sublink" th:classappend="${activePage == 'usuarios'} ? ' is-active' : ''" th:href="@{/modulos/usuarios}" title="Usuarios" data-nav-item data-nav-label="Usuarios" data-nav-group="EQUIPO Y SEGURIDAD">
								<i class="bi bi-person-gear" aria-hidden="true"></i><span>Usuarios</span>
							</a>
							<a class="sidebar-link sidebar-sublink" th:classappend="${activePage == 'tipos-usuario'} ? ' is-active' : ''" th:href="@{/modulos/tipos-usuario}" title="Tipos de usuario" data-nav-item data-nav-label="Tipos de usuario" data-nav-group="EQUIPO Y SEGURIDAD">
								<i class="bi bi-key" aria-hidden="true"></i><span>Tipos de usuario</span>
							</a>
						</div>
					</div>
				</th:block>
			</nav>
			<div class="sidebar-footer">
				<div class="sidebar-env-card" th:classappend="${ambientePruebas} ? ' is-test' : ''">
					<div class="sidebar-env-status">
						<span class="footer-dot" aria-hidden="true"></span>
						<div class="sidebar-env-copy">
							<strong th:text="${ambientePruebas} ? 'Ambiente de pruebas' : 'Ambiente principal'">Ambiente principal</strong>
							<small th:text="${ambientePruebas} ? 'Modo sandbox activo' : 'Espacio operativo'"></small>
						</div>
					</div>
					<a th:if="${ambientePruebas and !#strings.isEmpty(urlPrincipal)}" class="sidebar-env-btn" th:href="${urlPrincipal}" title="Volver al ambiente principal">
						<i class="bi bi-arrow-left" aria-hidden="true"></i><span>Volver</span>
					</a>
					<form method="post" th:if="${accesoDirectoPruebas}" th:action="@{/ambiente/ir-a-pruebas}" class="m-0">
						<button type="submit" class="sidebar-env-btn" title="Entrar a pruebas">
							<i class="bi bi-tools" aria-hidden="true"></i><span>Pruebas</span>
						</button>
					</form>
					<a th:if="${ambientePruebas != true and accesoDirectoPruebas != true and !#strings.isEmpty(urlPruebas)}" class="sidebar-env-btn" th:href="${urlPruebas}" title="Entrar a pruebas">
						<i class="bi bi-tools" aria-hidden="true"></i><span>Pruebas</span>
					</a>
				</div>
			</div>
		</div>
	</aside>
</body>
</html>
