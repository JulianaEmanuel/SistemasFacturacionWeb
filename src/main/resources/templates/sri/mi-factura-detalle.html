<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi comprobante | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page">
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('mis-facturas')}"></aside>
  <div class="app-main">
    <header th:replace="~{fragments/topbar :: topbar('Detalle de comprobante (Cliente)', 'CONSULTA')}"></header>
    <main class="content-area">
      <div th:if="${sriSuccess}" class="alert alert-success" role="status" th:text="${sriSuccess}"></div>
      <div th:if="${sriWarning}" class="alert alert-warning" role="alert" th:text="${sriWarning}"></div>

      <section class="page-intro">
        <h2 th:text="|Factura #${factura.id}|"></h2>
        <p th:text="${#temporals.format(factura.fecha,'dd/MM/yyyy HH:mm:ss')}"></p>
      </section>

      <section class="cliente-panel p-4">
        <dl class="row">
          <dt class="col-sm-3">Cliente</dt><dd class="col-sm-9" th:text="${factura.cliente}"></dd>
          <dt class="col-sm-3">Identificación</dt><dd class="col-sm-9" th:text="${factura.cedula}"></dd>
          <dt class="col-sm-3">Dirección</dt><dd class="col-sm-9" th:text="${factura.contacto.direccion ?: '—'}"></dd>
          <dt class="col-sm-3">Correo</dt><dd class="col-sm-9" th:text="${factura.contacto.correo ?: '—'}"></dd>
        </dl>

        <div class="table-responsive">
          <table class="management-table table align-middle">
            <thead>
              <tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Tarifa IVA</th><th>Subtotal</th><th>IVA</th><th>Total</th></tr>
            </thead>
            <tbody>
              <tr th:each="d : ${factura.lineas}">
                <td th:text="${d.nombre}"></td>
                <td th:text="${d.cantidadVisible()}"></td>
                <td th:text="${d.precioVisible()}"></td>
                <td th:text="${d.porcentajeVisible()}"></td>
                <td th:text="${d.subtotalVisible()}"></td>
                <td th:text="${d.ivaVisible()}"></td>
                <td th:text="${d.totalVisible()}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="text-end invoice-totals">
          <p>Subtotal: <strong th:text="${factura.subtotalVisible()}"></strong></p>
          <p>IVA: <strong th:text="${factura.ivaVisible()}"></strong></p>
          <p>Total: <strong th:text="${factura.totalVisible()}"></strong></p>
        </div>

        <section th:if="${emisor != null}" class="border rounded p-3 mb-3 bg-body-tertiary">
          <h3 class="h6">Estado SRI (<span th:text="${emisor.ambienteEtiqueta()}"></span>)</h3>
          <div class="small" th:if="${sri != null}">
            <p class="mb-1"><strong>Estado:</strong> <span th:text="${sri.estadoSri}"></span> · <strong>Exitoso en pruebas:</strong> <span th:text="${sri.exitosoPruebas ? 'Sí' : 'No'}"></span></p>
            <p class="mb-1"><strong>Clave de acceso:</strong> <code th:text="${sri.claveAcceso}"></code></p>
            <p class="mb-0" th:if="${sri.mensajeRetorno != null}"><strong>Retorno:</strong> <span th:text="${sri.mensajeRetorno}"></span></p>
          </div>
          <p class="small text-muted mb-0" th:if="${sri == null}">Aún no se ha generado o enviado el XML al SRI.</p>
        </section>

        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-outline-secondary" th:href="@{/modulos/mis-facturas}">Volver</a>
          <a class="btn btn-outline-dark" th:href="@{/modulos/facturas/{id}/xml(id=${factura.id})}">Descargar XML (SRI)</a>
          <a class="btn btn-outline-danger" target="_blank" th:href="@{/modulos/facturas/{id}/ride(id=${factura.id})}">Generar RIDE (PDF)</a>
          <form method="post" th:action="@{/modulos/facturas/{id}/enviar-sri(id=${factura.id})}" class="d-inline">
            <input type="hidden" name="origen" value="cliente">
            <button class="btn btn-success" type="submit">Enviar al SRI (Pruebas)</button>
          </form>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
